# `docker compose up --build` — the build reads `.env.production` from the build
# context (see Dockerfile), so edit that file and rebuild rather than overriding
# values here.
services:
  frontend:
    build:
      context: .
    image: evade-film:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    # The same file again, for the server side only: `API_URL` and the timeout
    # are read per request. `NEXT_PUBLIC_*` values are already frozen into the
    # bundle at build time and cannot be changed from here.
    env_file:
      - .env.production
    # How the container reaches the API when it is published on the host — the
    # default in `.env.production`. On Docker Desktop the name already exists;
    # on Linux this is what creates it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # To talk to the catalog backend container directly instead, over its own
    # compose network rather than out to the host and back through a published
    # port, uncomment both blocks and set `API_URL=http://web:8000`. The backend
    # answers by `Host:` header, so `web` has to be in its `ALLOWED_HOSTS` too.
    # `external` means compose expects the network to exist: the backend stack
    # has to be up first.
    #
    # networks:
    #   - default
    #   - catalog

# networks:
#   catalog:
#     name: evadesite-backend_default
#     external: true
